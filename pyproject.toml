[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lakeforge"
version = "0.1.0"
description = "Bronze/Silver/Gold lakehouse pipeline built with PySpark and Parquet for a synthetic online marketplace."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.14"
dependencies = [
    "pyspark==4.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.6,<1",
]
docs = [
    "matplotlib>=3.9,<4",
]

[project.scripts]
lakeforge = "lakeforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: end-to-end pipeline tests that run every layer",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "jobs", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "T20"]

[tool.ruff.lint.isort]
known-first-party = ["lakeforge"]
